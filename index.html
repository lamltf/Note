<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lịch Yêu Thương</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fff0f3;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: #ffffff;
            min-height: 100vh;
            padding: 40px 20px;
            box-sizing: border-box;
            box-shadow: 0 0 20px rgba(255, 174, 185, 0.2);
        }

        h1 {
            text-align: center;
            color: #ff4d6d;
            font-weight: 700;
            font-size: 26px;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #ff8fa3;
            font-size: 14px;
            margin-bottom: 35px;
            font-weight: 600;
        }

        .task-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .task-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(255, 77, 109, 0.1);
            border: 1px solid #ffe5e9;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }

        /* Phần đếm ngược nổi bật */
        .countdown-badge {
            background: linear-gradient(135deg, #ff758f 0%, #ff4d6d 100%);
            color: white;
            padding: 10px 18px;
            border-radius: 18px;
            text-align: center;
            margin-bottom: 15px;
            align-self: flex-start;
            box-shadow: 0 4px 12px rgba(255, 77, 109, 0.3);
        }

        .countdown-number {
            font-size: 20px;
            font-weight: 700;
        }

        .countdown-text {
            font-size: 12px;
            font-weight: 600;
            opacity: 0.9;
        }

        .task-info {
            font-size: 14px;
            color: #555;
            margin-bottom: 5px;
        }

        .task-info strong {
            color: #ff4d6d;
        }

        .message-box {
            background: #fff5f6;
            padding: 15px;
            border-radius: 18px;
            margin-top: 10px;
            color: #c9184a;
            font-size: 14px;
            line-height: 1.6;
            border-left: 5px solid #ffb3c1;
            font-weight: 500;
        }

        .empty-state {
            text-align: center;
            color: #ffb3c1;
            margin-top: 50px;
            font-weight: 600;
        }

        /* Hiệu ứng cho ngày hôm nay */
        .today-special {
            border: 2px solid #ff4d6d;
            background: #fff0f3;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>🌸 Lịch Yêu Thương</h1>
        <div class="subtitle">Cùng chờ đợi những điều ngọt ngào ✨</div>

        <div id="taskList" class="task-container">
            <p class="empty-state">Đang xem lịch...</p>
        </div>
    </div>

    <script>
        function calculateDaysRemaining(task) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const startDate = new Date(task.startDate);
            startDate.setHours(0, 0, 0, 0);

            if (task.type === 'yearly') {
                // Tính cho ngày hàng năm
                let nextDate = new Date(today.getFullYear(), startDate.getMonth(), startDate.getDate());
                if (nextDate < today) {
                    nextDate.setFullYear(today.getFullYear() + 1);
                }
                const diffTime = nextDate - today;
                return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            } else {
                // Tính theo chu kỳ
                const diffTime = today - startDate;
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                
                if (diffDays < 0) return Math.abs(diffDays); // Chưa tới ngày bắt đầu lần đầu
                
                const remainder = diffDays % task.cycleLength;
                return remainder === 0 ? 0 : task.cycleLength - remainder;
            }
        }

        fetch('config.json')
            .then(res => res.json())
            .then(tasks => {
                const list = document.getElementById('taskList');
                list.innerHTML = ''; 

                if (tasks.length === 0) {
                    list.innerHTML = '<p class="empty-state">Chưa có sự kiện nào được lưu 🎈</p>';
                    return;
                }

                tasks.forEach(task => {
                    const daysLeft = calculateDaysRemaining(task);
                    const card = document.createElement('div');
                    card.className = 'task-card';
                    
                    let countdownHTML = '';
                    if (daysLeft === 0) {
                        card.classList.add('today-special');
                        countdownHTML = `<div class="countdown-badge">
                            <span class="countdown-number">🌟 HÔM NAY 🌟</span>
                        </div>`;
                    } else {
                        countdownHTML = `<div class="countdown-badge">
                            <span class="countdown-text">Còn</span>
                            <span class="countdown-number">${daysLeft}</span>
                            <span class="countdown-text">ngày nữa</span>
                        </div>`;
                    }

                    card.innerHTML = `
                        ${countdownHTML}
                        <div class="task-info">🗓️ Ngày gốc: <strong>${task.startDate}</strong></div>
                        <div class="task-info">⏳ Chế độ: <strong>${task.type === 'yearly' ? 'Hàng năm' : 'Chu kỳ ' + task.cycleLength + ' ngày'}</strong></div>
                        
                        <div class="message-box">
                            💌 ${task.message}
                        </div>
                    `;
                    list.appendChild(card);
                });
            })
            .catch(err => {
                document.getElementById('taskList').innerHTML = '<p class="empty-state">Lỗi tải dữ liệu rồi bác ơi! 😭</p>';
            });
    </script>

</body>
</html>
