<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lịch Yêu Thương</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #ffeef2; /* Nền hồng pastel siêu nhạt */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        /* Khung hiển thị mô phỏng màn hình điện thoại */
        .app-container {
            width: 100%;
            max-width: 480px; /* Chuẩn kích thước mobile */
            background-color: #ffffff;
            min-height: 100vh;
            padding: 30px 20px 50px;
            box-sizing: border-box;
            box-shadow: 0 0 30px rgba(255, 182, 193, 0.3);
        }

        /* Header */
        h1 {
            text-align: center;
            color: #ff6b8b;
            font-weight: 700;
            font-size: 28px;
            margin-bottom: 5px;
            margin-top: 10px;
        }
        .subtitle {
            text-align: center;
            color: #ffa6b9;
            font-size: 14px;
            margin-bottom: 30px;
            font-weight: 600;
        }

        /* Ô nhập Webhook bảo mật */
        .webhook-box {
            background: #fff5f7;
            padding: 16px;
            border-radius: 20px;
            margin-bottom: 25px;
            border: 2px dashed #ffb6c1;
        }
        .webhook-box label {
            font-weight: 700;
            font-size: 14px;
            color: #ff6b8b;
            display: block;
            margin-bottom: 10px;
        }
        .webhook-box input {
            width: 100%;
            padding: 12px 15px;
            border: none;
            border-radius: 12px;
            box-sizing: border-box;
            font-family: 'Quicksand', sans-serif;
            font-size: 14px;
            background: #ffffff;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            outline: none;
            color: #333;
        }
        .webhook-box input:focus {
            box-shadow: 0 0 0 2px #ffb6c1;
        }
        .webhook-box small {
            color: #999;
            font-size: 12px;
            display: block;
            margin-top: 8px;
            font-weight: 500;
        }

        /* Danh sách Card */
        .task-container {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .task-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(255, 182, 193, 0.2);
            border: 1px solid #ffeaf0;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s;
        }

        /* Tem phân loại (Badge) góc phải */
        .task-badge {
            position: absolute;
            top: 0;
            right: 0;
            color: white;
            padding: 6px 14px;
            border-bottom-left-radius: 16px;
            font-size: 12px;
            font-weight: 700;
        }
        .badge-cycle { background: linear-gradient(135deg, #ff9a9e 0%, #ff6a88 100%); }
        .badge-yearly { background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%); color: #006b52;}

        .task-detail {
            font-size: 15px;
            color: #555;
            margin: 10px 0;
            font-weight: 600;
        }
        .task-detail span {
            display: inline-block;
            width: 30px;
        }

        /* Box lời nhắn */
        .message-box {
            background: #fff8fa;
            padding: 14px;
            border-radius: 16px;
            margin-top: 15px;
            color: #d8436e;
            font-size: 14px;
            line-height: 1.5;
            border-left: 4px solid #ff7b9c;
            font-weight: 500;
        }

        /* Nút Test Kute */
        .btn-test {
            width: 100%;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            color: #d6336c;
            border: none;
            padding: 14px;
            border-radius: 16px;
            font-weight: 700;
            font-family: 'Quicksand', sans-serif;
            font-size: 16px;
            cursor: pointer;
            margin-top: 18px;
            box-shadow: 0 4px 12px rgba(255, 154, 158, 0.4);
            transition: all 0.2s cubic-bezier(0.68, -0.55, 0.265, 1.55); /* Hiệu ứng nảy */
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .btn-test:active {
            transform: scale(0.95);
            box-shadow: 0 2px 6px rgba(255, 154, 158, 0.4);
        }

        /* Trạng thái tải/rỗng */
        .empty-state {
            text-align: center;
            color: #b5b5b5;
            font-weight: 600;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>🌸 Lịch Yêu Thương</h1>
        <div class="subtitle">Không bao giờ quên những ngày quan trọng ✨</div>

        <div class="webhook-box">
            <label>🔗 Trạm nối Discord (Nhập để Test)</label>
            <input type="password" id="webhookInput" placeholder="Dán link Webhook vào đây nhé...">
            <small>🔒 Dữ liệu bảo mật tuyệt đối, chỉ lưu trên điện thoại này.</small>
        </div>

        <div id="taskList" class="task-container">
            <p class="empty-state">Đang rinh dữ liệu về...</p>
        </div>
    </div>

    <script>
        const savedWebhook = localStorage.getItem('discord_webhook');
        if (savedWebhook) {
            document.getElementById('webhookInput').value = savedWebhook;
        }

        document.getElementById('webhookInput').addEventListener('input', function(e) {
            localStorage.setItem('discord_webhook', e.target.value);
        });

        fetch('config.json')
            .then(res => {
                if (!res.ok) throw new Error("Không tìm thấy file config.json");
                return res.json();
            })
            .then(tasks => {
                const list = document.getElementById('taskList');
                list.innerHTML = ''; 

                if (tasks.length === 0) {
                    list.innerHTML = '<p class="empty-state">Hiện tại chưa có sự kiện nào cả 🌵</p>';
                    return;
                }

                tasks.forEach(task => {
                    const card = document.createElement('div');
                    card.className = 'task-card';
                    
                    const isYearly = task.type === 'yearly';
                    const badgeClass = isYearly ? 'badge-yearly' : 'badge-cycle';
                    const badgeText = isYearly ? 'Hàng năm' : 'Chu kỳ';
                    const cycleText = isYearly ? 'Mỗi năm một lần' : `Lặp lại mỗi ${task.cycleLength} ngày`;

                    card.innerHTML = `
                        <div class="task-badge ${badgeClass}">${badgeText}</div>
                        <div class="task-detail"><span>🗓️</span> <strong>Bắt đầu:</strong> ${task.startDate}</div>
                        <div class="task-detail"><span>⏳</span> <strong>Lịch trình:</strong> ${cycleText}</div>
                        
                        <div class="message-box">
                            💌 ${task.message}
                        </div>

                        <button class="btn-test" onclick="sendTestMessage('${encodeURIComponent(task.message)}')">
                            🚀 Gửi thử thông báo
                        </button>
                    `;
                    list.appendChild(card);
                });
            })
            .catch(err => {
                console.error(err);
                document.getElementById('taskList').innerHTML = 
                    '<p class="empty-state" style="color: #ff6b8b;">⚠️ Úi! Không tải được lịch. Hãy kiểm tra lại file config nhé!</p>';
            });

        function sendTestMessage(encodedMessage) {
            const webhookUrl = document.getElementById('webhookInput').value.trim();
            
            if (!webhookUrl) {
                alert("Bạn dán Discord Webhook URL vào ô bên trên trước đã nhé! 🌸");
                document.getElementById('webhookInput').focus();
                return;
            }

            const message = decodeURIComponent(encodedMessage);
            const payload = {
                content: "✨ **[DING DONG - TEST TỪ APP]** ✨\n" + message
            };

            fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => {
                if (res.ok) {
                    alert("✅ Bíp bíp! Đã bắn thông báo vào Discord!");
                } else {
                    alert("❌ Lỗi rồi! Bạn kiểm tra lại đường link Webhook xem sao nhé.");
                }
            })
            .catch(err => {
                alert("❌ Mất mạng rồi! Không kết nối được tới Discord.");
                console.error(err);
            });
        }
    </script>

</body>
</html>
