<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Thông Báo Tự Động</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            max-width: 650px; 
            margin: 40px auto; 
            padding: 20px; 
            background-color: #f4f7f6; 
            color: #333; 
        }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        
        /* Box nhập Webhook an toàn */
        .webhook-box {
            background: #e8f4f8;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            border-left: 4px solid #3498db;
        }
        .webhook-box label { font-weight: bold; font-size: 14px; }
        .webhook-box input {
            width: 100%;
            padding: 8px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .webhook-box small { color: #666; font-size: 12px; display: block; margin-top: 5px; }

        /* Danh sách Task */
        .task-container { display: flex; flex-direction: column; gap: 15px; }
        .task-card { 
            background: #fff; 
            padding: 15px 20px; 
            border-radius: 10px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
            border-left: 5px solid #ff8da1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .task-info { flex-grow: 1; margin-right: 15px; }
        .task-info p { margin: 6px 0; font-size: 14px; }
        .label { font-weight: bold; color: #555; display: inline-block; width: 100px; }
        .message-box {
            background: #fff5f7;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            font-style: italic;
            color: #c2185b;
            font-size: 14px;
        }
        
        /* Nút Test */
        .btn-test { 
            background: #3498db; 
            color: white; 
            border: none; 
            padding: 10px 15px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            transition: 0.2s;
            white-space: nowrap;
        }
        .btn-test:hover { background: #2980b9; transform: scale(1.05); }
        .btn-test:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <h1>🌸 Lịch Yêu Thương 🌸</h1>

    <div class="webhook-box">
        <label>🔗 Discord Webhook URL (Chỉ dùng để Test):</label>
        <input type="password" id="webhookInput" placeholder="Dán link Webhook vào đây...">
        <small>🔒 Dữ liệu này chỉ lưu nội bộ trên máy bạn, hoàn toàn bảo mật và không đẩy lên mạng.</small>
    </div>

    <div id="taskList" class="task-container">
        <p style="text-align: center; color: #888;">Đang nạp dữ liệu từ hệ thống...</p>
    </div>

    <script>
        // 1. Tự động tải lại Webhook đã lưu vào ô input
        const savedWebhook = localStorage.getItem('discord_webhook');
        if (savedWebhook) {
            document.getElementById('webhookInput').value = savedWebhook;
        }

        // 2. Lưu Webhook vào máy mỗi khi người dùng nhập
        document.getElementById('webhookInput').addEventListener('input', function(e) {
            localStorage.setItem('discord_webhook', e.target.value);
        });

        // 3. Tải danh sách Task
        fetch('config.json')
            .then(res => {
                if (!res.ok) throw new Error("Không tìm thấy file config.json");
                return res.json();
            })
            .then(tasks => {
                const list = document.getElementById('taskList');
                list.innerHTML = ''; 

                if (tasks.length === 0) {
                    list.innerHTML = '<p style="text-align: center; color: #888;">Chưa có task thông báo nào.</p>';
                    return;
                }

                tasks.forEach((task, index) => {
                    const card = document.createElement('div');
                    card.className = 'task-card';
                    
                    // Hiển thị loại task cho dễ hiểu
                    let typeText = task.type === 'yearly' ? '📅 Hàng năm (So ngày/tháng)' : '🔄 Chu kỳ (Đếm ngày)';
                    let cycleText = task.type === 'yearly' ? 'Không áp dụng' : `${task.cycleLength} ngày`;

                    card.innerHTML = `
                        <div class="task-info">
                            <p><span class="label">Phân loại:</span> <strong style="color: #3498db;">${typeText}</strong></p>
                            <p><span class="label">Bắt đầu:</span> ${task.startDate}</p>
                            <p><span class="label">Chu kỳ:</span> ${cycleText}</p>
                            <div class="message-box">
                                ${task.message}
                            </div>
                        </div>
                        <button class="btn-test" onclick="sendTestMessage('${encodeURIComponent(task.message)}')">
                            🚀 Test
                        </button>
                    `;
                    list.appendChild(card);
                });
            })
            .catch(err => {
                console.error(err);
                document.getElementById('taskList').innerHTML = 
                    '<p style="text-align: center; color: red;">⚠️ Lỗi: Không thể tải danh sách. Hãy kiểm tra lại file config.json</p>';
            });

        // 4. Hàm Gửi Test Thông Báo
        function sendTestMessage(encodedMessage) {
            const webhookUrl = document.getElementById('webhookInput').value.trim();
            
            if (!webhookUrl) {
                alert("Bạn cần dán Discord Webhook URL vào ô phía trên cùng trước nhé!");
                document.getElementById('webhookInput').focus();
                return;
            }

            // Giải mã nội dung tin nhắn
            const message = decodeURIComponent(encodedMessage);

            // Thêm chữ [TEST] để bạn biết đây là tin nhắn bấm bằng tay
            const payload = {
                content: "🛠️ **[TEST TỪ GIAO DIỆN]**\n" + message
            };

            // Gọi API gửi thẳng tới Discord
            fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => {
                if (res.ok) {
                    alert("✅ Đã bắn thông báo test thành công vào Discord!");
                } else {
                    alert("❌ Lỗi: Gửi thất bại. Hãy kiểm tra lại link Webhook xem có đúng không.");
                }
            })
            .catch(err => {
                alert("❌ Lỗi mạng: Không thể kết nối tới Discord.");
                console.error(err);
            });
        }
    </script>

</body>
</html>
