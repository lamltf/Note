<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lịch Yêu Thương</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fff0f3;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: #ffffff;
            min-height: 100vh;
            padding: 40px 20px;
            box-sizing: border-box;
            box-shadow: 0 0 20px rgba(255, 174, 185, 0.2);
        }

        h1 {
            text-align: center;
            color: #ff4d6d;
            font-weight: 700;
            font-size: 26px;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #ff8fa3;
            font-size: 14px;
            margin-bottom: 25px;
            font-weight: 600;
        }

        /* --- THANH TÌM KIẾM & LỌC --- */
        .controls-container {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .search-box {
            flex: 1;
        }

        .search-box input, .filter-box select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ffe5e9;
            border-radius: 16px;
            font-family: 'Quicksand', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: #555;
            background-color: #ffffff;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .search-box input:focus, .filter-box select:focus {
            border-color: #ff758f;
        }

        .filter-box select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23ff758f%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 15px top 50%;
            background-size: 12px auto;
            padding-right: 35px;
        }

        /* --- DANH SÁCH TASK --- */
        .task-container { display: flex; flex-direction: column; gap: 20px; }
        .task-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(255, 77, 109, 0.1);
            border: 1px solid #ffe5e9;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .countdown-badge {
            background: linear-gradient(135deg, #ff758f 0%, #ff4d6d 100%);
            color: white;
            padding: 10px 18px;
            border-radius: 18px;
            text-align: center;
            margin-bottom: 15px;
            align-self: flex-start;
            box-shadow: 0 4px 12px rgba(255, 77, 109, 0.3);
        }
        .countdown-number { font-size: 20px; font-weight: 700; }
        .countdown-text { font-size: 12px; font-weight: 600; opacity: 0.9; }
        .task-info { font-size: 14px; color: #555; margin-bottom: 5px; }
        .task-info strong { color: #ff4d6d; }
        .message-box {
            background: #fff5f6;
            padding: 15px;
            border-radius: 18px;
            margin-top: 10px;
            color: #c9184a;
            font-size: 14px;
            line-height: 1.6;
            border-left: 5px solid #ffb3c1;
            font-weight: 500;
        }
        .empty-state { text-align: center; color: #ffb3c1; margin-top: 50px; font-weight: 600; }
        
        .today-special { border: 2px solid #ff4d6d; background: #fff0f3; animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>🌸 Lịch Yêu Thương</h1>
        <div class="subtitle">Cùng chờ đợi những điều ngọt ngào ✨</div>

        <div class="controls-container">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Tìm sự kiện, lời nhắn...">
            </div>
            <div class="filter-box">
                <select id="typeFilter">
                    <option value="all">Phân loại</option>
                    <option value="yearly">Hàng năm</option>
                    <option value="cycle">Chu kỳ</option>
                </select>
            </div>
        </div>

        <div id="taskList" class="task-container">
            <p class="empty-state">Đang xem lịch...</p>
        </div>
    </div>

    <script>
        let allTasks = []; // Lưu toàn bộ dữ liệu để lọc không cần tải lại trang

        // Hàm tính toán số ngày còn lại (như cũ)
        function calculateDaysRemaining(task) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const startDate = new Date(task.startDate);
            startDate.setHours(0, 0, 0, 0);

            if (task.type === 'yearly') {
                let nextDate = new Date(today.getFullYear(), startDate.getMonth(), startDate.getDate());
                if (nextDate < today) {
                    nextDate.setFullYear(today.getFullYear() + 1);
                }
                const diffTime = nextDate - today;
                return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            } else {
                const diffTime = today - startDate;
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                if (diffDays < 0) return Math.abs(diffDays);
                const remainder = diffDays % task.cycleLength;
                return remainder === 0 ? 0 : task.cycleLength - remainder;
            }
        }

        // Hàm hiển thị danh sách (đã bao gồm Lọc và Sắp xếp)
        function renderTasks() {
            const list = document.getElementById('taskList');
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            const filterType = document.getElementById('typeFilter').value;

            list.innerHTML = ''; 

            // 1. Tính số ngày còn lại cho tất cả task và đưa vào một mảng mới
            let processedTasks = allTasks.map(task => {
                return { ...task, daysLeft: calculateDaysRemaining(task) };
            });

            // 2. Lọc theo từ khóa tìm kiếm và loại (Hàng năm / Chu kỳ)
            processedTasks = processedTasks.filter(task => {
                const matchesSearch = task.message.toLowerCase().includes(searchText) || task.startDate.includes(searchText);
                const matchesType = filterType === 'all' || task.type === filterType;
                return matchesSearch && matchesType;
            });

            // 3. SẮP XẾP: Số ngày còn lại ít nhất (gần tới nhất) sẽ lên đầu
            processedTasks.sort((a, b) => a.daysLeft - b.daysLeft);

            // 4. In ra giao diện
            if (processedTasks.length === 0) {
                list.innerHTML = '<p class="empty-state">Không tìm thấy sự kiện nào cả 🕵️‍♀️</p>';
                return;
            }

            processedTasks.forEach(task => {
                const card = document.createElement('div');
                card.className = 'task-card';
                
                let countdownHTML = '';
                if (task.daysLeft === 0) {
                    card.classList.add('today-special');
                    countdownHTML = `<div class="countdown-badge">
                        <span class="countdown-number">🌟 HÔM NAY 🌟</span>
                    </div>`;
                } else {
                    countdownHTML = `<div class="countdown-badge">
                        <span class="countdown-text">Còn</span>
                        <span class="countdown-number">${task.daysLeft}</span>
                        <span class="countdown-text">ngày nữa</span>
                    </div>`;
                }

                card.innerHTML = `
                    ${countdownHTML}
                    <div class="task-info">🗓️ Ngày gốc: <strong>${task.startDate}</strong></div>
                    <div class="task-info">⏳ Chế độ: <strong>${task.type === 'yearly' ? 'Hàng năm' : 'Chu kỳ ' + task.cycleLength + ' ngày'}</strong></div>
                    <div class="message-box">💌 ${task.message}</div>
                `;
                list.appendChild(card);
            });
        }

        // Lắng nghe sự kiện khi người dùng gõ vào ô tìm kiếm hoặc đổi bộ lọc
        document.getElementById('searchInput').addEventListener('input', renderTasks);
        document.getElementById('typeFilter').addEventListener('change', renderTasks);

        // Tải dữ liệu ban đầu từ config.json
        fetch('config.json')
            .then(res => res.json())
            .then(tasks => {
                allTasks = tasks; // Lưu vào biến toàn cục
                renderTasks(); // Gọi hàm render lần đầu
            })
            .catch(err => {
                document.getElementById('taskList').innerHTML = '<p class="empty-state">Lỗi tải dữ liệu rồi bác ơi! 😭</p>';
            });
    </script>

</body>
</html>
